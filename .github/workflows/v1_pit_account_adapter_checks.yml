name: V1 PIT account input adapter checks
on:
  push:
    branches: [validation/v1-krx-pit-smoke-20261105]
    paths:
      - .github/workflows/v1_pit_account_adapter_checks.yml
      - validation/trend_audit/krx_pit_private/pit_account_replay.py
      - validation/trend_audit/krx_pit_private/account_path_metrics.py
      - validation/trend_audit/krx_pit_private/test_account_adapter.py
permissions:
  contents: read
jobs:
  offline_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline validation dependencies
        run: python -m pip install 'pandas==2.2.3' 'numpy>=1.26,<3' 'pyarrow>=18,<24' 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.30,<3' 'exchange-calendars==4.13.1'
      - name: Check collectors, signals and account input adapter without credentials
        run: python -B -m unittest discover -s validation/trend_audit/krx_pit_private -p 'test*.py' -v
