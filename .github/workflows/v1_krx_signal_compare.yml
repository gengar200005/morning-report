name: KRX private PIT signal comparison
on:
  push:
    branches: [validation/v1-krx-pit-smoke-20261105]
    paths: [.github/workflows/v1_krx_signal_compare.yml]
permissions:
  contents: read
concurrency:
  group: isolated-krx-private-history
  cancel-in-progress: false
jobs:
  compare_signals:
    if: github.repository == 'gengar200005/morning-report'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install 'pandas==2.2.3' 'numpy>=1.26,<3' 'pyarrow>=18,<24' 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.30,<3' 'exchange-calendars==4.13.1'
      - name: Test original private collectors and new signal diagnostics
        run: python -B -m unittest discover -s validation/trend_audit/krx_pit_private -p 'test*.py' -v
      - name: Prepare prior-day official membership for private signal comparison
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          SIGNAL_PACK_NAME: V1_PIT_SIGNAL_FEATURES_32ef8ade9e1b8dfb.zip
          SIGNAL_PACK_SHA256: 32ef8ade9e1b8dfb28b732f74a2a57f0acf8e723df8bb896aacf9649856dfee7
        run: python -B validation/trend_audit/krx_pit_private/export_signal_membership.py
