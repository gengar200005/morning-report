name: V1 KIS corporate action metadata probe

on:
  push:
    branches:
      - validation/v1-kis-sample-20261104
    paths:
      - .github/workflows/v1_kis_actions.yml
      - validation/trend_audit/kis_actions/**

permissions:
  contents: read
  actions: read

concurrency:
  group: v1-kis-actions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'gengar200005/morning-report' && github.ref == 'refs/heads/validation/v1-kis-sample-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only client dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Check frozen probe and immutable helper
        run: |
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          root = Path('validation/trend_audit')
          assert hashlib.sha256((root / 'kis_actions/plan.json').read_bytes()).hexdigest() == '91de77714a24bcc6ef431688e16be95ee4c0d88306cc9e264a719e0d0d1ea0ec'
          assert hashlib.sha256((root / 'kis_actions/run_options.json').read_bytes()).hexdigest() == '51bfb47b7de451a9a112e49fc3f9a813d06d598e2f7c6aadf70c063cdc309534'
          assert hashlib.sha256((root / 'kis_v1/collect.py').read_bytes()).hexdigest() == '30c130cee54517fc67b73a3a4600b6b685780bec213ee523b5e67b9011b13a59'
          PYCODE
      - name: Test probe without authentication or network
        run: python -B -m unittest discover -s validation/trend_audit/kis_actions -v
      - name: Prepare fresh output and fixed recovery option
        id: prepare
        env:
          RESULT_DIR: ${{ runner.temp }}/v1-kis-actions-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          options = json.loads(Path('validation/trend_audit/kis_actions/run_options.json').read_text())
          assert set(options) == {'resume_run_id'}
          resume = options['resume_run_id']
          assert resume is None or (type(resume) is int and resume > 0)
          assert resume in (None, 41789248223), 'Recovery source was not reviewed'
          Path(os.environ['RESULT_DIR']).mkdir(parents=True, exist_ok=False)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              print('resume_run_id=' + (str(resume) if resume is not None else ''), file=stream)
          PYCODE
      - name: Restore reviewed twenty-request evidence
        if: steps.prepare.outputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.prepare.outputs.resume_run_id }}
          name: v1-kis-actions-${{ steps.prepare.outputs.resume_run_id }}-1
          path: ${{ runner.temp }}/v1-kis-actions-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record execution
        env:
          RESULT_DIR: ${{ runner.temp }}/v1-kis-actions-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RESUME_RUN_ID: ${{ steps.prepare.outputs.resume_run_id }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RESULT_DIR'])
          assert out.is_dir()
          resume = os.environ['RESUME_RUN_ID']
          prior = out / 'workflow_run.json'
          if resume:
              assert prior.is_file(), 'Recovered source execution metadata missing'
              archived = out / ('source_workflow_run_' + resume + '.json')
              assert not archived.exists(), 'Source execution metadata collision'
              prior.rename(archived)
          (out / 'workflow_run.json').write_text(json.dumps({'run_url':os.environ['RUN_URL'], 'commit_sha':os.environ['COMMIT_SHA'], 'resume_run_id':int(resume) if resume else None}, indent=2) + '\n')
          PYCODE
      - name: Read only missing requests from extended sixty-six-request plan
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          RESULT_DIR: ${{ runner.temp }}/v1-kis-actions-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -B validation/trend_audit/kis_actions/collect_actions.py --out "$RESULT_DIR"
      - name: Preserve completed and partial metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-kis-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1-kis-actions-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
