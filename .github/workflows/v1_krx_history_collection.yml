name: KRX PIT private historical collection pilot 2017-01
on:
  push:
    branches: [validation/v1-krx-pit-smoke-20261105]
    paths:
      - .github/workflows/v1_krx_history_collection.yml
      - validation/trend_audit/krx_pit_private/drive_collect_history.py
permissions:
  contents: read
concurrency:
  group: isolated-krx-private-history
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'gengar200005/morning-report'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install KRX private collector dependencies
        run: python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.30,<3' 'exchange-calendars==4.13.1'
      - name: Validate historical trading calendar without API credentials
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('validation/trend_audit/krx_pit_private/drive_collect_history.py')
          spec=importlib.util.spec_from_file_location('krx_history',p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          jan=m.sessions(2017,1)
          assert len(jan)==20 and jan[0]=='20170102' and jan[-1]=='20170131'
          assert sum(len(m.sessions(2017,month)) for month in range(1,13))==243
          assert sum(len(m.sessions(2026,month)) for month in range(1,11))==204
          print('HISTORICAL_XKRX_CALENDAR_PASS')
          PY
      - name: Collect 2017 January privately
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python -B validation/trend_audit/krx_pit_private/drive_collect_history.py --year 2017 --months 1
