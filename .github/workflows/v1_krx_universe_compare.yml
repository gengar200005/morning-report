name: KRX private PIT universe comparison
on:
  push:
    branches: [validation/v1-krx-pit-smoke-20261105]
    paths: [.github/workflows/v1_krx_universe_compare.yml]
permissions:
  contents: read
concurrency:
  group: isolated-krx-private-history
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'gengar200005/morning-report'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only comparison dependencies
        run: python -m pip install 'requests>=2.31,<3' 'google-api-python-client>=2.100,<3' 'google-auth>=2.30,<3' 'exchange-calendars==4.13.1'
      - name: Run offline regression tests
        run: python -B -m unittest discover -s validation/trend_audit/krx_pit_private -p 'test*.py' -v
      - name: Compare existing monthly archives and save derived evidence privately
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python -B validation/trend_audit/krx_pit_private/compare_universe.py
