name: KRX PIT private Drive storage preflight
on:
  push:
    branches: [validation/v1-krx-pit-smoke-20261105]
    paths:
      - .github/workflows/v1_krx_private_drive.yml
      - validation/trend_audit/krx_pit_private/drive_preflight.py
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'gengar200005/morning-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Google Drive helper dependencies
        run: python -m pip install 'google-api-python-client>=2.100,<3' 'google-auth>=2.30,<3'
      - name: Verify private Drive destination with existing OAuth
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python -B validation/trend_audit/krx_pit_private/drive_preflight.py
